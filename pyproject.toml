[project]
name = "hw6"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "matplotlib>=3.10.1",
    "numpy==1.26.4",
    "pandas>=2.2.3",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "tqdm>=4.67.1",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [   
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
